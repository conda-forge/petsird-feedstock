schema_version: 1

context:
  version: "0.10.0"

package:
  name: petsird
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/petsird/petsird-${{ version }}.tar.gz
  sha256: cc63f8d3605b44668567ecdee2c355ac78c8e1ba4f55ba31d54215a82812e282

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm >=3.4
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.22

tests:
  - python:
      imports:
        - petsird
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Library and tools for working with Positron Emission Tomography Standardization Initiative Raw Data (PETSIRD)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ETSInitiative/PETSIRD

extra:
  recipe-maintainers:
    - gschramm
    - KrisThielemans
    - casperdcl
