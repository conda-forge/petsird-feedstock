schema_version: 1

context:
  version: "0.13.0"

recipe:
  name: petsird
  version: ${{ version }}

build:
  number: 0
  skip:
    - win
    - osx and not arm64

outputs:
  - package:
      name: petsird
    source:
      - url: https://pypi.org/packages/source/p/petsird/petsird-${{ version }}.tar.gz
        sha256: 11ab9921c7aaf222f816aacda5c1ec2de8c9fbe578175c4a0d0a13fe1d197fb4
    build:
      noarch: python
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=42
        - setuptools-scm >=3.4
        - pip
      run:
        - python >=${{ python_min }}
        - numpy >=1.22
    tests:
      - python:
          imports:
            - petsird
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: libpetsird
    source:
      - url: https://github.com/ETSInitiative/PETSIRD/archive/refs/tags/v${{ version }}.tar.gz
        sha256: 29b17679c9a83f7661bc4ca4b99dde921e04e2131527f046e0c764fa685944db
    build:
      script:
        # can't currently use "just" as it doesn't allow setting CMAKE_PREFIX_PATH,
        # which seems necessary for finding blas
        - cd $SRC_DIR
        - env DEST=yardl ./install_yardl.sh
        - cd model && ../yardl/yardl generate && cd ..
        - cmake -GNinja -S cpp -B cpp/build -DCMAKE_INSTALL_PREFIX:PATH="${PREFIX}"
        - ninja -C cpp/build install
        # Need to have the same name as in PyPI for the `about: license_file` to work
        - mv LICENSE.txt LICENSE
    requirements:
      build:
        - cmake
        - ninja
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
      host:
        - hdf5
        - howardhinnant_date>=3.0.1
        - nlohmann_json>=3.11.2
        - xtensor>=0.24.2
        - xtensor-blas
      run:
        - nlohmann_json>=3.11.2
        - xtensor>=0.24.2
        - xtensor-blas
    tests:
      - package_contents:
          include:
            - petsird_helpers.h
            - petsird/types.h
            - petsird/protocols.h
            # self-distributed yardl (i.e. under petsird/) since there is no yardl-headers conda package (yet) to pin to instead
            - petsird/yardl/yardl.h
          files:
            - lib/cmake/PETSIRD-*/PETSIRDConfig.cmake
            - lib/cmake/PETSIRD-*/PETSIRDConfigVersion.cmake
            - lib/*petsird.* # libpetsird.a or equivalent should be present

about:
  summary: Library and tools for working with Positron Emission Tomography Standardization Initiative Raw Data (PETSIRD)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ETSInitiative/PETSIRD

extra:
  recipe-maintainers:
    - gschramm
    - KrisThielemans
    - casperdcl
