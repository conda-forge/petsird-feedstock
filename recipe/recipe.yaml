schema_version: 1

context:
  version: "0.11.1"

recipe:
  name: petsird
  version: ${{ version }}

build:
  number: 0
  skip:
    - win
    - osx and not arm64

outputs:
  - package:
      name: petsird
    source:
      - url: https://pypi.org/packages/source/p/petsird/petsird-${{ version }}.tar.gz
        sha256: 77d3f0f1916cd4a45ae71ea327bd9fba29849f092ef9304dab0a336c4c2195c6
    build:
      noarch: python
      skip:
        - not linux
      script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python ${{ python_min }}.*
        - setuptools >=42
        - setuptools-scm >=3.4
        - pip
      run:
        - python >=${{ python_min }}
        - numpy >=1.22
    tests:
      - python:
          imports:
            - petsird
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
  - package:
      name: libpetsird
    source:
      - if: target_platform == "linux-64"
        then:
          url: https://github.com/ETSInitiative/PETSIRD/releases/download/v${{ version }}/petsird_v${{ version }}_linux_x86_64.tar.gz
          sha256: e647b0603adfafcb55815d9a72610141fbdafca877bd30db9b69a22a2f55e07a
      - if: target_platform == "osx-arm64"
        then:
          url: https://github.com/ETSInitiative/PETSIRD/releases/download/v${{ version }}/petsird_v${{ version }}_darwin_arm64.tar.gz
          sha256: 23c584e3ed2b015bf9ad3c0cf9e19a23b2d0dfb2fcd2c55a1e4c5f15476754b3
    build:
      script: cp -R include lib $PREFIX
      files:
        - include/*
        - lib/*
    requirements:
      run:
        - hdf5>=1.12.1
        - howardhinnant_date>=3.0.1
        - nlohmann_json>=3.11.2
        - xtensor>=0.24.2
        - xtensor-blas
    tests:
      - package_contents:
          include:
            - petsird_helpers.h
            - petsird/types.h
            - petsird/protocols.h
            # self-distributed yardl (i.e. under petsird/) since there is no yardl-headers conda package (yet) to pin to instead
            - petsird/yardl/yardl.h
          files:
            - lib/cmake/PETSIRD-*/PETSIRDConfig.cmake
            - lib/cmake/PETSIRD-*/PETSIRDConfigVersion.cmake
            - lib/*petsird.* # libpetsird.a or equivalent should be present

about:
  summary: Library and tools for working with Positron Emission Tomography Standardization Initiative Raw Data (PETSIRD)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ETSInitiative/PETSIRD

extra:
  recipe-maintainers:
    - gschramm
    - KrisThielemans
    - casperdcl
