schema_version: 1

context:
  version: "0.9.1"

package:
  name: petsird
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/petsird/petsird-${{ version }}.tar.gz
  sha256: 16445ebe2ad9c551218f5691e97a22df76e493fa8a29999acd67ea695a81b0c9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
  - python ${{ python_min }}.*
  - setuptools >=42
  - setuptools-scm >=3.4
  - pip
  run:
  - python >=${{ python_min }}
  - numpy >=1.22

tests:
- python:
    imports:
    - petsird
    pip_check: true
    python_version:
    - ${{ python_min }}.*
    - "*"

about:
  summary: Library and tools for working with Positron Emission Tomography Standardization Initiative Raw Data (PETSIRD)
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/ETSInitiative/PETSIRD

extra:
  recipe-maintainers:
  - gschramm
  - KrisThielemans
  - casperdcl
